# データ分割とラベル付けの統合テンプレート
# 各ティッカーの実験設定生成時のベーステンプレートとして使用

split:
  # 分割方式: cpcv (Combinatorial Purged Cross-Validation)
  method: "cpcv"
  
  # 全ブロック数
  n_blocks: 10
  
  # テストに使用するブロック数
  n_test_blocks: 2
  
  # Purging期間（日数） - ラベルの最大保有期間と同じ
  purge_window: 5
  
  # Embargo期間（日数） - 追加の安全マージン
  embargo_window: 3
  
  # 出力ディレクトリ（ティッカー名が自動追加される）
  save_dir: "data/splits/{ticker}"
  input_data: data/processed/{ticker}_features_labeled.csv
  date_column: Date
  stats_columns:
    - Returns
    - Close

labeling:
  # ラベル付けを有効化
  enabled: true
  
  # ラベル付け方式: triple_barrier
  method: "triple_barrier"
  
  # 上限バリア（利益確定）: +3%
  upper_return: 0.03
  
  # 下限バリア（損切り）: -2%
  lower_return: -0.02
  
  # 最大保有日数（時間バリア）
  max_holding_days: 5
  
  # 価格参照列名
  reference_column: "Close"
  
  # ラベル出力列名
  label_column: "Label"
  
  # ニュートラルラベル(0)を含むか
  include_neutral: true
  
  # 入力データのパス（rawディレクトリのparquetファイル）
  input_data: "data/raw/{ticker}.parquet"
  
  # 出力データのパス
  output_data: "data/processed/{ticker}_features_labeled.csv"
